<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Outer Dark Contour for high contrast on light & dark browser tabs -->
  <rect x="2" y="1" width="12" height="14" fill="#090a0f" rx="1"/>

  <!-- Golden Knight Crown / Crest -->
  <rect x="4" y="1" width="6" height="2" fill="#ca8a04"/>
  <rect x="3" y="2" width="8" height="2" fill="#eab308"/>
  <rect x="6" y="1" width="2" height="1" fill="#fef08a"/>

  <!-- Steel Helmet Face / Visor -->
  <rect x="3" y="4" width="8" height="5" fill="#3b82f6"/>
  <rect x="4" y="4" width="6" height="1" fill="#60a5fa"/>

  <!-- Dark Visor Eye Slit -->
  <rect x="3" y="6" width="8" height="2" fill="#020617"/>
  <!-- Glowing Cyan Eyes -->
  <rect x="4" y="6" width="2" height="1" fill="#38bdf8"/>
  <rect x="8" y="6" width="2" height="1" fill="#38bdf8"/>

  <!-- Knight Armor Collar / Grille -->
  <rect x="3" y="9" width="8" height="3" fill="#1d4ed8"/>
  <rect x="4" y="10" width="6" height="2" fill="#1e3a8a"/>
  <rect x="5" y="10" width="1" height="2" fill="#090a0f"/>
  <rect x="8" y="10" width="1" height="2" fill="#090a0f"/>

  <!-- Glowing Enchanted Sword on the Right -->
  <rect x="12" y="2" width="1" height="9" fill="#f8fafc"/>
  <rect x="12" y="3" width="1" height="1" fill="#38bdf8"/>
  <rect x="12" y="6" width="1" height="1" fill="#38bdf8"/>
  <rect x="11" y="9" width="3" height="1" fill="#94a3b8"/>
  <rect x="12" y="10" width="1" height="3" fill="#78350f"/>
  <rect x="12" y="13" width="1" height="1" fill="#facc15"/>
</svg>